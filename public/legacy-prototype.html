<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia · 产品原型</title>
<style>
:root {
  --bg: #FAFAF6;
  --surface: #FFFFFF;
  --surface-2: #F4F2EC;
  --surface-3: #EFEDE5;
  --ink: #1A1715;
  --ink-2: #5C5852;
  --ink-3: #948F86;
  --line: #E6E3DA;
  --line-2: #D8D4C8;
  --accent: #7B4A0F;
  --accent-bg: #F4EAD7;
  --accent-line: #E0CDA3;
  --lit: #3D3680;
  --lit-bg: #ECE9F5;
  --lit-line: #C9C2E5;
  --green: #166848;
  --green-bg: #E1F0E8;
  --shadow: 0 1px 2px rgba(20,15,10,0.04), 0 0 0 0.5px rgba(20,15,10,0.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14110F;
    --surface: #1C1917;
    --surface-2: #211E1B;
    --surface-3: #272320;
    --ink: #F0EDE5;
    --ink-2: #B0AAA0;
    --ink-3: #7A7569;
    --line: #2D2925;
    --line-2: #3A3530;
    --accent: #E0B870;
    --accent-bg: #2D2010;
    --accent-line: #4A3520;
    --lit: #9B92E5;
    --lit-bg: #1F1B35;
    --lit-line: #2F2A4D;
    --green: #6BBD8E;
    --green-bg: #0F2419;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 0 0 0.5px rgba(255,255,255,0.06);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.serif {
  font-family: 'Charter', 'Iowan Old Style', 'Source Serif 4', 'Source Serif Pro', Georgia, 'Songti SC', 'Noto Serif SC', serif;
  font-feature-settings: "kern", "liga";
}
.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 280px 1fr;
}

/* Left navigation */
.shell-nav {
  background: var(--surface-2);
  border-right: 0.5px solid var(--line);
  padding: 28px 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
  padding-left: 6px;
}
.brand-mark {
  font-family: 'Charter', 'Iowan Old Style', Georgia, serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.shell-meta {
  font-size: 11px;
  color: var(--ink-3);
  margin: 0 0 24px 6px;
  line-height: 1.5;
}
.layer-group { margin-bottom: 18px; }
.layer-label {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 8px 6px;
  font-weight: 500;
}
.page-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  margin-bottom: 1px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  background: transparent;
  border: 0.5px solid transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
  transition: background 0.12s;
}
.page-btn:hover { background: var(--surface-3); }
.page-btn.active {
  background: var(--surface);
  border-color: var(--line);
  box-shadow: var(--shadow);
}
.page-btn .pn {
  font-size: 10px;
  font-weight: 500;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: var(--surface-3);
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.page-btn.active .pn {
  background: var(--ink);
  color: var(--bg);
}
.page-btn .star {
  margin-left: auto;
  color: var(--accent);
  font-size: 10px;
}

/* Right canvas */
.shell-canvas {
  background: var(--bg);
  padding: 24px 28px 60px;
  min-height: 100vh;
}
.canvas-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--ink-3);
}
.canvas-meta .url-pill {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 11px;
  background: var(--surface-2);
  padding: 4px 10px;
  border-radius: 4px;
  color: var(--ink-2);
}
.canvas-meta .layer-tag {
  padding: 3px 8px;
  font-size: 10px;
  border-radius: 4px;
  background: var(--accent-bg);
  color: var(--accent);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
}
.purpose-line {
  font-size: 12px;
  color: var(--ink-2);
  margin: 0 0 18px;
  padding: 8px 12px;
  background: var(--surface-2);
  border-left: 2px solid var(--accent);
  border-radius: 0 4px 4px 0;
  line-height: 1.6;
}
.flow-line {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 18px;
  padding-top: 12px;
  border-top: 0.5px solid var(--line);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
}
.flow-line b { color: var(--ink-2); font-weight: 500; }

/* Page mockup container */
.page-mockup {
  background: var(--surface);
  border-radius: 8px;
  border: 0.5px solid var(--line);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.pm-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  border-bottom: 0.5px solid var(--line);
  font-size: 13px;
}
.pm-logo {
  font-family: 'Charter', Georgia, serif;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.pm-nav-links {
  display: flex;
  gap: 22px;
  margin-left: 8px;
  flex: 1;
}
.pm-nav-links a {
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13px;
}
.pm-nav-links a.active { color: var(--ink); font-weight: 500; }
.pm-nav-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.pm-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--lit-bg);
  color: var(--lit);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 500;
}
.pm-body {
  padding: 36px 48px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  border: 0.5px solid transparent;
  text-decoration: none;
  font-weight: 500;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn-secondary {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line-2);
}
.btn-ghost {
  background: transparent;
  color: var(--ink-2);
}
.btn-block { width: 100%; }
.btn-lg { padding: 12px 24px; font-size: 14px; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-amber {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
@media (prefers-color-scheme: dark) {
  .btn-amber { color: #1A1715; }
}

/* Form */
.field {
  display: block;
  margin-bottom: 14px;
}
.field-label {
  font-size: 12px;
  color: var(--ink-2);
  margin-bottom: 6px;
  display: block;
}
.input {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface);
  border: 0.5px solid var(--line-2);
  border-radius: 6px;
  font-size: 14px;
  color: var(--ink);
  font-family: inherit;
}
.input:focus {
  outline: none;
  border-color: var(--ink);
}
.divider-or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
  font-size: 11px;
  color: var(--ink-3);
}
.divider-or::before, .divider-or::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: var(--line);
}

/* Cards & content blocks */
.card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: 8px;
  padding: 18px 20px;
}
.card-2 {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 16px 18px;
}
.lbl-eyebrow {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
  margin: 0 0 6px;
}
.h-display {
  font-family: 'Charter', 'Iowan Old Style', Georgia, 'Songti SC', serif;
  font-size: 38px;
  line-height: 1.18;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin: 0;
  color: var(--ink);
}
.h-section {
  font-family: 'Charter', Georgia, serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.005em;
  margin: 0 0 6px;
}
.h-card {
  font-family: 'Charter', Georgia, serif;
  font-size: 17px;
  font-weight: 500;
  margin: 0 0 4px;
}
.lead {
  font-size: 16px;
  color: var(--ink-2);
  line-height: 1.55;
  margin: 12px 0 0;
}
.muted { color: var(--ink-2); }
.faded { color: var(--ink-3); }
.tabular { font-variant-numeric: tabular-nums; }

.tag-pill {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.tag-undergrad { background: var(--surface-3); color: var(--ink-2); }
.tag-mba { background: var(--accent-bg); color: var(--accent); }
.tag-phd { background: var(--lit-bg); color: var(--lit); }

/* Node card variants */
.node-card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  transition: border-color 0.12s;
}
.node-card:hover { border-color: var(--line-2); }
.node-card.lit {
  background: var(--lit-bg);
  border-color: var(--lit-line);
}
.node-card.locked {
  background: var(--surface-2);
  opacity: 0.55;
}
.node-card.featured {
  background: var(--accent-bg);
  border-color: var(--accent-line);
}
.node-title {
  font-family: 'Charter', Georgia, serif;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  color: var(--ink);
}
.node-prof {
  font-size: 11px;
  color: var(--ink-3);
  font-style: italic;
}
.lit .node-prof { color: var(--lit); opacity: 0.8; }
.featured .node-prof { color: var(--accent); opacity: 0.85; }
.node-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 4px;
}
.price {
  font-family: 'Charter', Georgia, serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}
.price-faded { color: var(--ink-3); }
.lit-mark {
  font-size: 11px;
  color: var(--lit);
  font-weight: 500;
}
.node-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* Conversation bubbles */
.dlg {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}
.dlg-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
}
.dlg-avatar.ai {
  background: var(--ink);
  color: var(--bg);
  font-family: 'Charter', Georgia, serif;
}
.dlg-avatar.user {
  background: var(--accent-bg);
  color: var(--accent);
}
.dlg-body {
  flex: 1;
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  padding-top: 4px;
}
.dlg-body em {
  font-style: italic;
  color: var(--ink-2);
}
.dlg-meta {
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 4px;
}

/* Progress */
.progress {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--ink);
  border-radius: 2px;
}

/* Stat numbers */
.stat-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-num {
  font-family: 'Charter', Georgia, serif;
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.stat-num small { font-size: 14px; color: var(--ink-3); font-weight: 400; }

/* Misc */
.row { display: flex; gap: 16px; }
.row-tight { display: flex; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 16px; }
.col-tight { display: flex; flex-direction: column; gap: 8px; }
.between { justify-content: space-between; }
.center { align-items: center; }
.flex-1 { flex: 1; }
.mt-2 { margin-top: 12px; }
.mt-3 { margin-top: 18px; }
.mt-4 { margin-top: 28px; }
.mt-5 { margin-top: 40px; }
.mb-2 { margin-bottom: 12px; }
.mb-3 { margin-bottom: 18px; }
.mb-4 { margin-bottom: 28px; }
.divider {
  height: 0.5px;
  background: var(--line);
  margin: 24px 0;
}
.divider-soft {
  height: 0.5px;
  background: var(--line);
  margin: 12px 0;
}

.checkmark {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--lit);
  color: white;
  font-size: 9px;
  text-align: center;
  line-height: 14px;
  margin-right: 4px;
}
.lockmark {
  display: inline-block;
  font-size: 11px;
  color: var(--ink-3);
}

/* Newsletter form */
.nl-card {
  background: var(--ink);
  color: var(--bg);
  padding: 28px 32px;
  border-radius: 10px;
  margin-top: 32px;
}
.nl-card .lbl-eyebrow { color: rgba(255,255,255,0.5); }
.nl-card h3 { color: var(--bg); }
.nl-row {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.nl-input {
  flex: 1;
  padding: 10px 14px;
  background: rgba(255,255,255,0.08);
  border: 0.5px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: var(--bg);
  font-size: 13px;
  font-family: inherit;
}
.nl-input::placeholder { color: rgba(255,255,255,0.45); }
.nl-btn {
  padding: 10px 18px;
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  font-weight: 500;
  font-size: 13px;
  border: none;
  cursor: pointer;
  font-family: inherit;
}

/* Founder quote */
.founder-quote {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  padding: 20px 0;
}
.founder-photo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Charter', Georgia, serif;
  font-size: 22px;
  color: var(--accent);
  flex-shrink: 0;
  font-weight: 500;
}
.founder-text {
  font-family: 'Charter', Georgia, serif;
  font-size: 17px;
  line-height: 1.5;
  font-style: italic;
  color: var(--ink-2);
}
.founder-name {
  font-size: 12px;
  color: var(--ink-3);
  font-style: normal;
  margin-top: 6px;
}

/* Onboarding cards */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.choice {
  padding: 16px 18px;
  background: var(--surface);
  border: 0.5px solid var(--line-2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.choice:hover { border-color: var(--ink-3); }
.choice.selected {
  background: var(--lit-bg);
  border-color: var(--lit);
  color: var(--ink);
}
.choice-title { font-weight: 500; margin-bottom: 2px; }
.choice-desc { font-size: 12px; color: var(--ink-3); }

/* Notes archive */
.note-row {
  padding: 16px 0;
  border-bottom: 0.5px solid var(--line);
  cursor: pointer;
}
.note-row:hover { background: var(--surface-2); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
.note-row:last-child { border-bottom: none; }
.note-row-title { font-family: 'Charter', Georgia, serif; font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.note-row-meta { font-size: 12px; color: var(--ink-3); }
.note-row-tags { display: inline-flex; gap: 6px; margin-left: 10px; }
.note-tag {
  font-size: 10px;
  padding: 1px 6px;
  background: var(--surface-3);
  color: var(--ink-2);
  border-radius: 3px;
}

/* Coming up cards */
.upnext-card {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  background: var(--surface-2);
  border-radius: 8px;
  align-items: center;
}
.upnext-mark {
  width: 36px; height: 36px;
  background: var(--lit-bg);
  color: var(--lit);
  font-family: 'Charter', Georgia, serif;
  font-weight: 500;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.upnext-title { font-family: 'Charter', Georgia, serif; font-weight: 500; font-size: 15px; }
.upnext-desc { font-size: 12px; color: var(--ink-3); }

/* Order summary */
.order-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 14px;
  border-bottom: 0.5px solid var(--line);
}
.order-row:last-child { border: none; padding-top: 14px; font-weight: 500; }

.pay-method {
  display: flex;
  gap: 8px;
}
.pay-method label {
  flex: 1;
  padding: 14px;
  border: 0.5px solid var(--line-2);
  border-radius: 6px;
  text-align: center;
  cursor: pointer;
  font-size: 13px;
}
.pay-method input { display: none; }
.pay-method input:checked + label {
  border-color: var(--ink);
  background: var(--surface-2);
}

/* Reading prose */
.prose {
  font-family: 'Charter', Georgia, serif;
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink-2);
}
.prose strong { color: var(--ink); font-weight: 500; }
.prose .pull {
  font-size: 13px;
  color: var(--ink-3);
  margin: 0 0 8px;
  font-family: -apple-system, sans-serif;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* Paywall */
.paywall {
  background: var(--accent-bg);
  border: 0.5px solid var(--accent-line);
  border-radius: 10px;
  padding: 24px;
  text-align: center;
  margin-top: 24px;
}
.paywall h3 {
  font-family: 'Charter', Georgia, serif;
  font-size: 18px;
  margin: 0 0 6px;
  color: var(--accent);
}
.paywall p {
  font-size: 13px;
  color: var(--ink-2);
  margin: 0 0 16px;
}

/* Map / college view */
.college-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 28px;
  border-bottom: 0.5px solid var(--line);
}
.college-tab {
  padding: 12px 16px;
  font-size: 14px;
  font-family: 'Charter', Georgia, serif;
  color: var(--ink-3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -0.5px;
}
.college-tab.active {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.tier-section { margin-bottom: 32px; }
.tier-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}
.tier-name {
  font-family: 'Charter', Georgia, serif;
  font-size: 17px;
  font-weight: 500;
}
.tier-meta {
  font-size: 12px;
  color: var(--ink-3);
}

/* Banner */
.banner {
  background: linear-gradient(0deg, var(--accent-bg), var(--accent-bg));
  border: 0.5px solid var(--accent-line);
  border-radius: 8px;
  padding: 16px 20px;
  display: flex;
  align-items: center;

const LAYERS = [
  { id: 0, t: 'Layer 0 · 公共层（不需登录）', k: ['landing', 'preview'] },
  { id: 1, t: 'Layer 1 · 入口层', k: ['signup', 'onboarding'] },
  { id: 2, t: 'Layer 2 · 核心学习层', k: ['dashboard', 'map', 'detail', 'chat', 'complete'] },
  { id: 3, t: 'Layer 3 · 支撑层', k: ['pay', 'archive', 'founders'] },
  { id: 4, t: 'Layer 4 · 设置层', k: ['settings'] }
];

const nav = document.getElementById('nav');
nav.innerHTML = LAYERS.map(l => `
  <div class="layer-group">
    <div class="layer-label">${l.t}</div>
    ${l.k.map(k => `
      <button class="page-btn" data-key="${k}">
        <span class="pn">${PAGES[k].n}</span>
        <span>${PAGES[k].t}</span>
        ${PAGES[k].s ? '<span class="star">★</span>' : ''}
      </button>
    `).join('')}
  </div>
`).join('');

function render(k) {
  const p = PAGES[k];
  document.getElementById('canvas').innerHTML = `
    <div class="canvas-meta">
      <span class="layer-tag">Layer ${p.l}${p.s ? ' · 核心页' : ''}</span>
      <span class="url-pill">${p.u}</span>
      <span style="margin-left:auto;font-size:12px;">${p.t}</span>
    </div>
    <p class="purpose-line">${p.p}</p>
    ${p.body}
    <div class="flow-line">
      <div><b>FROM</b> &nbsp; ${p.f}</div>
      <div><b>NEXT</b> &nbsp; ${p.nx}</div>
    </div>
  `;
  document.querySelectorAll('.page-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === k);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.page-btn').forEach(b => {
  b.addEventListener('click', () => render(b.dataset.key));
});

render('landing');
